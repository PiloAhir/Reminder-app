name: Build Maro Reminder APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Do not use android-actions/setup-android here:
      # its default package list may request the obsolete SDK package "tools".
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "${SDKMANAGER}" ]; then
            echo "sdkmanager was not found under ${ANDROID_HOME}/cmdline-tools"
            exit 1
          fi
          echo "Using: ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses || true
          "${SDKMANAGER}" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maro-Reminder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
